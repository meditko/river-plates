<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River Store | متجر ريفر الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; transition: all 0.25s ease; }
        body { background-color: #0b0f19; color: #f8fafc; padding-bottom: 80px; }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 1000;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-container { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; }
        .logo {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 3px; text-decoration: none;
        }

        .cart-status {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white; padding: 8px 16px; border-radius: 25px; font-weight: 700; cursor: pointer;
        }

        .btn-admin-login {
            background: rgba(255, 255, 255, 0.05); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 600;
        }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; }

        #admin-panel {
            display: none; background: #1e293b; padding: 22px; border-radius: 18px; margin-bottom: 30px;
            border: 1px solid #10b981;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; outline: none; }
        .btn-submit { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }

        .product-card {
            background: #1e293b; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer;
        }
        .product-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .product-card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #0f172a; }
        .product-card-body { padding: 15px; text-align: center; }
        .product-card-title { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; }
        .product-card-price { color: #38bdf8; font-size: 17px; font-weight: 800; }
        .click-hint { font-size: 11px; color: #94a3b8; margin-top: 8px; display: block; }

        /* Modal Details */
        .details-modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(8px);
        }
        .details-content {
            background: #1e293b; margin: 5% auto; padding: 24px; border-radius: 20px; width: 90%; max-width: 550px;
            border: 1px solid rgba(255, 255, 255, 0.1); max-height: 85vh; overflow-y: auto; position: relative;
        }
        .details-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }

        /* ChatBot */
        .chatbot-toggle-btn {
            position: fixed; bottom: 25px; left: 25px; background: linear-gradient(135deg, #25d366, #128c7e);
            color: white; border: none; padding: 14px 22px; border-radius: 35px; font-weight: 800; cursor: pointer; z-index: 1001;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }
        .chatbot-box {
            display: none; position: fixed; bottom: 85px; left: 25px; width: calc(100% - 50px); max-width: 340px;
            background: #1e293b; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.6); z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;
        }
        .chatbot-header { background: #075e54; color: white; padding: 14px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; }
        .chatbot-messages { height: 220px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; font-size: 13px; }
        .chat-msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; }
        .chat-msg.bot { background: #334155; color: white; align-self: flex-start; }
        .chat-msg.user { background: #0284c7; color: white; align-self: flex-end; }
        .chatbot-input-area { display: flex; padding: 8px; background: #1e293b; gap: 6px; }
        .chatbot-input-area input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 10px; color: white; border-radius: 8px; outline: none; }
        .chatbot-input-area button { background: #25d366; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; }

        /* Cart */
        .cart-modal { display: none; position: fixed; z-index: 1500; left: 0; top: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.8); }
        .cart-content { background: #1e293b; margin: 10% auto; padding: 22px; border-radius: 18px; width: 90%; max-width: 450px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 12px 0; }
        .btn-close { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <button class="btn-admin-login" onclick="loginAdmin()">التاجر ⚙️</button>
        <div class="logo-container">
            <a href="#" class="logo">RIVER 🌊</a>
        </div>
        <div class="cart-status" onclick="openCartModal()">🛒 <span id="cart-count">0</span></div>
    </header>

    <div class="container">

        <div id="admin-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                <h3 style="color: #10b981;">⚙️ لوحة التاجر لإضافة منتج</h3>
                <button class="btn-close" onclick="closeAdmin()">إغلاق ✖</button>
            </div>
            <div class="form-group"><label>اسم المنتج:</label><input type="text" id="p-name"></div>
            <div class="form-group"><label>السعر:</label><input type="number" id="p-price"></div>
            <div class="form-group"><label>الوصف:</label><textarea id="p-desc"></textarea></div>
            <div class="form-group"><label>اسم أو رابط الصورة:</label><input type="text" id="p-image"></div>
            <button class="btn-submit" onclick="addNewProduct()">إضافة للمتجر 🚀</button>
        </div>

        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #e2e8f0;">🛍️ المعرض المتاح (اضغط على الصورة للتفاصيل)</h2>
        <div class="products-grid" id="products-grid"></div>
    </div>

    <!-- Modal Details -->
    <div id="detailsModal" class="details-modal">
        <div class="details-content">
            <button class="btn-close" style="position: absolute; left: 15px; top: 15px;" onclick="closeDetailsModal()">✖</button>
            <img id="modal-img" class="details-img" src="" alt="المنتج">
            <h2 id="modal-title" style="color: white; font-size: 20px; margin-bottom: 6px;"></h2>
            <div style="color: #f59e0b; margin-bottom: 8px;">★★★★★ (5.0)</div>
            <div id="modal-price" style="color: #38bdf8; font-size: 22px; font-weight: 800; margin-bottom: 12px;"></div>
            <p id="modal-desc" style="color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 18px; background: #0f172a; padding: 12px; border-radius: 10px;"></p>
            <button id="modal-add-btn" style="background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 800; width: 100%; font-size: 15px; margin-bottom: 20px;">أضف إلى السلة 🛒</button>
        </div>
    </div>

    <!-- ChatBot -->
    <button class="chatbot-toggle-btn" onclick="toggleChatbot()">🤖 المساعد الذكي</button>
    <div class="chatbot-box" id="chatbot-box">
        <div class="chatbot-header">
            <span>🤖 River Bot</span>
            <span style="cursor:pointer;" onclick="toggleChatbot()">✖</span>
        </div>
        <div class="chatbot-messages" id="chat-messages">
            <div class="chat-msg bot">مرحباً بك في River Store! 🌊 كيف يمكنني مساعدتك؟ (استفسار، عروض، أو الدعم والشكاوى).</div>
        </div>
        <div class="chatbot-input-area">
            <input type="text" id="bot-input" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendBotMessage()">
            <button onclick="sendBotMessage()">إرسال</button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="cart-modal">
        <div class="cart-content">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
                <h3 style="color: white;">🛒 سلة المشتريات</h3>
                <button class="btn-close" onclick="closeCartModal()">✖</button>
            </div>
            <div id="cart-items-list" style="margin: 15px 0;"></div>
            <h3 style="font-size: 16px; color: #e2e8f0; margin-bottom: 15px;">الإجمالي: <span id="cart-total" style="color:#38bdf8;">0</span> ج.م</h3>
            <button style="background:#25d366; color:white; border:none; width:100%; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="checkoutWhatsApp()">إتمام الشراء عبر الواتساب 📲</button>
        </div>
    </div>

    <script>
        const MY_PHONE_NUMBER = "01099207307"; 
        let cart = JSON.parse(localStorage.getItem('river_cart_final')) || [];
        
        // المنتجات مع روابط الصور المباشرة وروابط أونلاين احتياطية
        let products = JSON.parse(localStorage.getItem('river_products_final')) || [
            {
                id: 1,
                name: "كلب هاسكي سيبيري أصيل",
                price: 9500,
                desc: "كلب هاسكي سيبيري تمتاز بالعيون الملونة والذكاء العالي، مطعم بالكامل مع شهادة صحية.",
                image: "https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=500"
            },
            {
                id: 2,
                name: "سيارة سكودا كودياك 2024",
                price: 1850000,
                desc: "سيارة Skoda Kodiaq المذهلة، لون أحمر ملكي، كاملة المواصفات بانوراما وأعلى فئة.",
                image: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=500"
            },
            {
                id: 3,
                name: "سماعات Apple AirPods Pro 2",
                price: 8900,
                desc: "سماعة أبل ايربودز برو الجيل الثاني مع خاصية العزل الصوتي الفائق والعلبة اللاسلكية.",
                image: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500"
            }
        ];

        function renderProductsGrid() {
            let grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            products.forEach((prod, index) => {
                grid.innerHTML += `
                    <div class="product-card" onclick="openDetailsModal(${index})">
                        <img src="${prod.image}" alt="${prod.name}">
                        <div class="product-card-body">
                            <div class="product-card-title">${prod.name}</div>
                            <div class="product-card-price">${prod.price.toLocaleString()} ج.م</div>
                            <span class="click-hint">اضغط لمعاينة التفاصيل ⭐</span>
                        </div>
                    </div>
                `;
            });
            updateCartCount();
        }

        function openDetailsModal(index) {
            let prod = products[index];
            document.getElementById('modal-img').src = prod.image;
            document.getElementById('modal-title').innerText = prod.name;
            document.getElementById('modal-price').innerText = prod.price.toLocaleString() + " ج.م";
            document.getElementById('modal-desc').innerText = prod.desc || "لا يوجد وصف إضافي حالياً.";
            document.getElementById('modal-add-btn').onclick = function() {
                addToCart(prod.name, prod.price);
                closeDetailsModal();
            };
            document.getElementById('detailsModal').style.display = 'block';
        }

        function closeDetailsModal() { document.getElementById('detailsModal').style.display = 'none'; }

        function toggleChatbot() {
            let box = document.getElementById('chatbot-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function sendBotMessage() {
            let input = document.getElementById('bot-input');
            let text = input.value.trim();
            if (!text) return;
            addChatMessage(text, 'user');
            input.value = '';
            setTimeout(() => { addChatMessage(getBotReply(text), 'bot'); }, 400);
        }

        function addChatMessage(msg, sender) {
            let container = document.getElementById('chat-messages');
            let msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${sender}`;
            msgDiv.innerHTML = msg;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function getBotReply(msg) {
            let lower = msg.toLowerCase();
            if (lower.includes("تواصل") || lower.includes("شكوى") || lower.includes("رقم") || lower.includes("شكاوي") || lower.includes("دعم")) {
                return `للتواصل المباشر مع إدارة المتجر أو الشكاوى، يرجى الاتصال بنا على:<br><br>📞 <b><a href="tel:${MY_PHONE_NUMBER}" style="color:#38bdf8;">${MY_PHONE_NUMBER}</a></b><br><br><a href="https://wa.me/2${MY_PHONE_NUMBER}" target="_blank" style="color:#25d366; font-weight:bold;">المحادثة المباشرة عبر الواتساب 📲</a>`;
            }
            return "مرحباً بك! اضغط على صورة أي منتج لعرض تفاصيله وسعره كاملة. 😊";
        }

        function addToCart(title, price) {
            let item = cart.find(i => i.title === title);
            if (item) item.quantity += 1;
            else cart.push({ title, price, quantity: 1 });
            localStorage.setItem('river_cart_final', JSON.stringify(cart));
            updateCartCount();
            alert("تمت الإضافة للسلة بنجاح! 🛒");
        }

        function updateCartCount() {
            let total = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = total;
        }

        function openCartModal() {
            let list = document.getElementById('cart-items-list');
            let total = 0;
            if (cart.length === 0) {
                list.innerHTML = `<p style="color:#94a3b8; text-align:center;">السلة فارغة حالياً.</p>`;
            } else {
                list.innerHTML = '';
                cart.forEach((item) => {
                    let subTotal = item.price * item.quantity;
                    total += subTotal;
                    list.innerHTML += `<div class="cart-item"><div><b>${item.title}</b> (${item.quantity})</div><div>${subTotal.toLocaleString()} ج.م</div></div>`;
                });
            }
            document.getElementById('cart-total').innerText = total.toLocaleString();
            document.getElementById('cartModal').style.display = 'block';
        }

        function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("السلة فارغة!");
            let msg = "مرحباً River Store! أريد شراء الطلبات التالية:%0A";
            cart.forEach(item => { msg += `- ${item.title} (العدد: ${item.quantity})%0A`; });
            window.open(`https://wa.me/2${MY_PHONE_NUMBER}?text=${msg}`, '_blank');
        }

        function loginAdmin() {
            if (prompt("كلمة سر التاجر:") === "1234") document.getElementById('admin-panel').style.display = 'block';
        }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

        function addNewProduct() {
            let name = document.getElementById('p-name').value;
            let price = parseFloat(document.getElementById('p-price').value);
            let desc = document.getElementById('p-desc').value;
            let image = document.getElementById('p-image').value;
            if (name && price) {
                products.push({ id: Date.now(), name, price, desc, image });
                localStorage.setItem('river_products_final', JSON.stringify(products));
                renderProductsGrid();
                closeAdmin();
            }
        }

        renderProductsGrid();
    </script>
</body>
</html>
